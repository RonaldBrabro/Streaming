<main class="main">
  <div style="max-width: 900px; margin: 0 auto; padding: 1rem;">
    <h1>Streaming App (Cassandra + Angular)</h1>

    <div style="display:flex; gap:1rem; align-items:flex-start; margin-top:1rem;">
      <div style="width:280px;">
        <h3>Videos</h3>
        <ul>
          <li *ngFor="let v of videos">
            <a href="#" (click)="select(v); $event.preventDefault()">{{ v.title }}</a>
          </li>
        </ul>
      </div>

      <div style="flex:1">
        <div *ngIf="selected; else noSelected">
          <app-video-player [video]="selected"></app-video-player>
        </div>
        <ng-template #noSelected>
          <p>Selecciona un video para verlo y leer/comentar.</p>
        </ng-template>
      </div>
    </div>
  </div>
</main>

<router-outlet />
