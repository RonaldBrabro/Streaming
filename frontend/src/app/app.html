<div class="app">
  <!-- Header -->
  <header class="header">
    <h1>Twitch Clone</h1>
    <div class="user-actions">
      <button *ngIf="!currentUser" (click)="showLogin = true">Login</button>
      <button *ngIf="!currentUser" (click)="showRegister = true">Register</button>
      <button *ngIf="currentUser" (click)="showCreateChannel = true">Create Channel</button>
      <span *ngIf="currentUser">{{ currentUser.nickname }}</span>
      <button *ngIf="currentUser" (click)="logout()">Logout</button>
    </div>
  </header>

  <div class="main-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h3>Categories</h3>
      <ul>
        <li *ngFor="let cat of homeData?.categories" (click)="selectCategory(cat)">{{ cat.name }}</li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="content" *ngIf="!currentUser || currentUser.role !== 'admin'">
      <div class="streams-grid" *ngIf="(homeData?.featuredStreams || []).length > 0; else noStreams">
        <div *ngFor="let stream of homeData?.featuredStreams" class="stream-card" (click)="selectStream(stream)">
          <img [src]="stream.thumbnail" alt="thumbnail">
          <h4>{{ stream.title }}</h4>
          <p>{{ stream.viewers }} viewers</p>
          <span *ngIf="stream.is_live" class="live">LIVE</span>
        </div>
      </div>
      <ng-template #noStreams>
        <div class="no-streams">
          <h2>No se han subido videos todavía</h2>
          <p>¡Sé el primero en crear contenido! Regístrate y comienza a transmitir.</p>
        </div>
      </ng-template>

      <div *ngIf="selectedStream" class="player-section">
        <h2>{{ selectedStream.title }}</h2>
        <app-video-player [video]="selectedStream"></app-video-player>
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div *ngIf="showLogin" class="modal">
    <div class="modal-content">
      <h3>Login</h3>
      <input [(ngModel)]="loginForm.email" placeholder="Email">
      <input [(ngModel)]="loginForm.password" type="password" placeholder="Password">
      <button (click)="login()">Login</button>
      <button (click)="showLogin = false">Cancel</button>
    </div>
  </div>

  <div *ngIf="showRegister" class="modal">
    <div class="modal-content">
      <h3>Register</h3>
      <input [(ngModel)]="registerForm.email" placeholder="Email">
      <input [(ngModel)]="registerForm.password" type="password" placeholder="Password">
      <input [(ngModel)]="registerForm.nickname" placeholder="Nickname">
      <input [(ngModel)]="registerForm.region" placeholder="Region">
      <button (click)="register()">Register</button>
      <button (click)="showRegister = false">Cancel</button>
    </div>
  </div>

  <div *ngIf="showCreateChannel" class="modal">
    <div class="modal-content">
      <h3>Create Channel</h3>
      <input [(ngModel)]="channelForm.nombre_canal" placeholder="Channel Name">
      <textarea [(ngModel)]="channelForm.biografia" placeholder="Bio"></textarea>
      <input [(ngModel)]="channelForm.stream_key" placeholder="Stream Key">
      <button (click)="createChannel()">Create</button>
      <button (click)="showCreateChannel = false">Cancel</button>
    </div>
  </div>
</div>
<app-admin-panel *ngIf="currentUser?.role === 'admin'"></app-admin-panel>
